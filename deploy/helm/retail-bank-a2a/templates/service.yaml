apiVersion: v1
kind: Service
metadata:
  name: {{ include "retail-bank-a2a.fullname" . }}
  labels:
    {{- include "retail-bank-a2a.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "retail-bank-a2a.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }

