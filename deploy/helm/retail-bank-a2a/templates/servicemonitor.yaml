{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "retail-bank-a2a.fullname" . }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "retail-bank-a2a.name" . }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}

